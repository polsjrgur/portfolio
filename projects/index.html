<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All nine projects in Dong XueJie's design portfolio." />
    <meta name="theme-color" content="#ffffff" />
    <title>All Projects - Dong XueJie</title>
    <script>document.documentElement.classList.add('js', 'site-intro-pending');</script>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../detail-reveal.css" />
    <link rel="stylesheet" href="../site-logo.css" />
    <link rel="stylesheet" href="../site-intro.css" />
  </head>
  <body class="projects-page">
    <div class="cursor-position" aria-hidden="true"><div class="cursor-center"><span class="cursor-shape"></span></div></div>

    <header class="site-header">
      <a class="brand" href="../index.html#top" aria-label="Back to portfolio home">
        <span class="brand-motion">
          <svg class="site-logo" viewBox="0 0 488.57 145.82" aria-hidden="true" focusable="false">
            <defs>
              <clipPath id="logo-first-tail-clip"><rect x="47" y="-4" width="446" height="88" /></clipPath>
              <clipPath id="logo-second-tail-clip"><rect x="199" y="65" width="294" height="85" /></clipPath>
            </defs>
            <use class="logo-d" href="../assets/site-logo.svg#logo-d" />
            <g class="logo-tail" clip-path="url(#logo-first-tail-clip)">
              <use href="../assets/site-logo.svg#logo-first-o" />
              <use href="../assets/site-logo.svg#logo-first-n" />
              <use href="../assets/site-logo.svg#logo-first-g" />
              <use href="../assets/site-logo.svg#logo-first-x" />
              <use href="../assets/site-logo.svg#logo-first-u" />
              <use href="../assets/site-logo.svg#logo-first-e-one" />
              <use href="../assets/site-logo.svg#logo-first-j" />
              <use href="../assets/site-logo.svg#logo-first-j-dot" />
              <use href="../assets/site-logo.svg#logo-first-i" />
              <use href="../assets/site-logo.svg#logo-first-i-dot" />
              <use href="../assets/site-logo.svg#logo-first-e-two" />
            </g>
            <use class="logo-rule" href="../assets/site-logo.svg#logo-rule" />
            <use class="logo-p" href="../assets/site-logo.svg#logo-p" />
            <g class="logo-tail" clip-path="url(#logo-second-tail-clip)">
              <use href="../assets/site-logo.svg#logo-second-o-one" />
              <use href="../assets/site-logo.svg#logo-second-r" />
              <use href="../assets/site-logo.svg#logo-second-t" />
              <use href="../assets/site-logo.svg#logo-second-f" />
              <use href="../assets/site-logo.svg#logo-second-o-two" />
              <use href="../assets/site-logo.svg#logo-second-l" />
              <use href="../assets/site-logo.svg#logo-second-i" />
              <use href="../assets/site-logo.svg#logo-second-o-three" />
            </g>
          </svg>
        </span>
      </a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="menu-panel">
        <span class="sr-only">Open menu</span><span></span><span></span>
      </button>
    </header>

    <main id="top" class="projects-content">
      <div class="projects-heading" data-detail-reveal-group>
        <p class="projects-kicker reveal-text">Portfolio / 2026</p>
        <h1 class="reveal-text">All Projects</h1>
      </div>
      <div class="projects-toolbar">
        <div class="projects-filters" role="group" aria-label="Filter projects">
          <button class="projects-filter" type="button" data-filter="all" aria-pressed="true"><span>All</span></button>
          <button class="projects-filter" type="button" data-filter="poster" aria-pressed="false"><span>Poster Design</span></button>
          <button class="projects-filter" type="button" data-filter="brand" aria-pressed="false"><span>Brand Identity</span></button>
          <button class="projects-filter" type="button" data-filter="packaging" aria-pressed="false"><span>Packaging Design</span></button>
          <button class="projects-filter" type="button" data-filter="typography-editorial" aria-pressed="false"><span>Typography &amp; Editorial</span></button>
          <button class="projects-filter" type="button" data-filter="ui-ux" aria-pressed="false"><span>UI/UX Design</span></button>
        </div>
        <p class="projects-count" role="status" aria-live="polite"></p>
      </div>
      <div class="projects-grid" aria-label="All portfolio projects"></div>
      <footer class="projects-footer">
        <a href="../index.html#selected-work">Back to Home <svg class="arrow-icon" aria-hidden="true" viewBox="0 0 18 12"><path d="M1 6h15M11 1l5 5-5 5" /></svg></a>
      </footer>
    </main>

    <aside id="menu-panel" class="menu-panel" aria-hidden="true">
      <nav aria-label="Project navigation">
        <a href="../index.html#top">Index</a>
        <a href="./">Work</a>
        <a href="../index.html#career-profile">Profile</a>
      </nav>
    </aside>

    <dialog class="project-dialog">
      <button class="dialog-close" type="button" aria-label="Close project">×</button>
      <div class="dialog-layout">
        <div class="dialog-art"><img src="" alt="" /></div>
        <div class="dialog-copy">
          <h2></h2>
          <p class="dialog-category"></p>
          <p class="dialog-description"></p>
          <a class="dialog-project-link" href="#" hidden><span>View case study</span><svg class="arrow-icon" aria-hidden="true" viewBox="0 0 18 12"><path d="M1 6h15M11 1l5 5-5 5" /></svg></a>
          <dl><div><dt>Role</dt><dd>Art direction / Design</dd></div><div><dt>Year</dt><dd>2026</dd></div></dl>
        </div>
      </div>
    </dialog>

    <script src="../cursor-morph.js"></script>
    <script src="../projects-data.js"></script>
    <script src="./script.js"></script>
    <script src="../detail-reveal.js"></script>
    <script src="../site-logo.js"></script>
    <script src="../site-intro.js"></script>
  </body>
</html>
